
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pertanyaan Penting banget littt</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="sparkles" aria-hidden="true"></div>

            <h1 id="title">Apakah kamu suka akuh?</h1>

            <div class="gif-wrapper">
                <img
                    id="gif"
                    class="robby-gif"
                    src="robby-robi.gif"
                    alt="Cute reaction"
                >
            </div>

            <p id="message" aria-live="polite"></p>

            <div class="button-container">
                <button id="yesBtn" class="btn yes-btn" type="button">
                    Iya banget 💕
                </button>

                <button id="noBtn" class="btn no-btn" type="button">
                    Najis 😭
                </button>
            </div>

        </div>

    </main>

    <div id="hearts-container" aria-hidden="true"></div>

    <script src="scripts.js"></script>

</body>
</html>
